<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ROI cell selection</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #ddd; height: 100vh;
         font: 13px system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; }
  header { padding: 10px 16px; background: #191919; border-bottom: 1px solid #2c2c2c;
           display: flex; align-items: center; gap: 18px; flex: none; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header .hint { color: #888; font-size: 12px; }
  a { color: #6cf; }
  #panels { flex: 1; display: flex; min-height: 0; }
  .panel { flex: 1; display: flex; flex-direction: column; min-width: 0;
           border-right: 1px solid #2c2c2c; }
  .panel:last-child { border-right: 0; }
  .ptitle { padding: 6px 12px; background: #161616; border-bottom: 1px solid #2c2c2c;
            display: flex; justify-content: space-between; align-items: center; flex: none; }
  .ptitle b { color: #6cf; font-variant-numeric: tabular-nums; }
  .stage { flex: 1; position: relative; overflow: hidden; cursor: crosshair; min-height: 0; }
  .wrap { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .wrap img { display: block; image-rendering: pixelated; user-select: none; -webkit-user-drag: none; }
  .wrap svg { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
  .btns { display: flex; gap: 6px; }
  button { padding: 4px 10px; background: #2c2c2c; color: #ddd; border: 1px solid #3c3c3c;
           border-radius: 4px; cursor: pointer; font-size: 12px; }
  button:hover { background: #383838; }
  button.primary { background: #14435e; border-color: #1d5f85; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  footer { flex: none; padding: 10px 16px; background: #191919; border-top: 1px solid #2c2c2c;
           display: flex; align-items: center; gap: 14px; }
  #out { flex: 1; padding: 5px 8px; background: #111; color: #ddd;
         border: 1px solid #333; border-radius: 4px; font-family: ui-monospace, monospace; }
  #count { font-variant-numeric: tabular-nums; }
  #count b { color: #4caf50; font-size: 15px; }
  .warn { color: #e0a030; }
</style>
</head>
<body>

<header>
  <h1>ROI cell selection</h1>
  <span class="hint">Click to place vertices · <b>close</b> to finish the shape ·
    wheel zoom, right-drag pan · a cell counts if it is inside <b>either</b> boundary</span>
  <span style="margin-left:auto"><a href="/">← viewer</a></span>
</header>

<div id="panels">
  <div class="panel">
    <div class="ptitle">
      <span>first frame &nbsp;<b id="tf">t0</b></span>
      <span class="btns">
        <button data-a="close" data-p="0">close</button>
        <button data-a="undo"  data-p="0">undo</button>
        <button data-a="clear" data-p="0">clear</button>
        <button data-a="fit"   data-p="0">fit</button>
      </span>
    </div>
    <div class="stage" id="stage0">
      <div class="wrap" id="wrap0"><img id="img0"><svg id="svg0"></svg></div>
    </div>
  </div>
  <div class="panel">
    <div class="ptitle">
      <span>last frame &nbsp;<b id="tl">tn</b></span>
      <span class="btns">
        <button data-a="close" data-p="1">close</button>
        <button data-a="undo"  data-p="1">undo</button>
        <button data-a="clear" data-p="1">clear</button>
        <button data-a="fit"   data-p="1">fit</button>
      </span>
    </div>
    <div class="stage" id="stage1">
      <div class="wrap" id="wrap1"><img id="img1"><svg id="svg1"></svg></div>
    </div>
  </div>
</div>

<footer>
  <button id="preview" class="primary">preview selection</button>
  <span id="count">—</span>
  <input id="out" spellcheck="false">
  <button id="save">save roi</button>
</footer>

<script>
const $ = id => document.getElementById(id);
let meta = {}, panels = [];

function mkPanel(i, t) {
  const p = {
    i, t, pts: [], closed: false,
    stage: $('stage' + i), wrap: $('wrap' + i), img: $('img' + i), svg: $('svg' + i),
    view: {x: 0, y: 0, k: 1},
  };
  p.img.src = `/projection?t=${t}`;
  p.img.onload = () => { fit(p); draw(p); };

  p.stage.addEventListener('wheel', e => {
    e.preventDefault();
    const r = p.stage.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const k = Math.max(0.05, Math.min(40, p.view.k * Math.exp(-e.deltaY * 0.0015)));
    p.view.x = mx - (mx - p.view.x) * (k / p.view.k);
    p.view.y = my - (my - p.view.y) * (k / p.view.k);
    p.view.k = k;
    apply(p);
  }, {passive: false});

  // Right-drag pans; left-click places vertices, so panning must not steal it.
  let drag = null;
  p.stage.addEventListener('contextmenu', e => e.preventDefault());
  p.stage.addEventListener('mousedown', e => {
    if (e.button === 2) drag = {x: e.clientX - p.view.x, y: e.clientY - p.view.y};
  });
  addEventListener('mousemove', e => {
    if (!drag) return;
    p.view.x = e.clientX - drag.x; p.view.y = e.clientY - drag.y; apply(p);
  });
  addEventListener('mouseup', () => { drag = null; });

  p.stage.addEventListener('click', e => {
    if (p.closed) return;
    const [x, y] = toImage(p, e);
    if (x < 0 || y < 0 || x > meta.width || y > meta.height) return;
    p.pts.push([x, y]);
    draw(p);
  });
  return p;
}

// Screen -> image coordinates.  Vertices are stored in image space so zooming and panning
// can never change what the boundary encloses.
function toImage(p, e) {
  const r = p.stage.getBoundingClientRect();
  return [(e.clientX - r.left - p.view.x) / p.view.k,
          (e.clientY - r.top - p.view.y) / p.view.k];
}

function apply(p) {
  p.wrap.style.transform = `translate(${p.view.x}px, ${p.view.y}px) scale(${p.view.k})`;
  draw(p);
}

function fit(p) {
  const k = Math.min(p.stage.clientWidth / meta.width, p.stage.clientHeight / meta.height);
  p.view = {k, x: (p.stage.clientWidth - meta.width * k) / 2,
                y: (p.stage.clientHeight - meta.height * k) / 2};
  apply(p);
}

function draw(p) {
  const s = 1 / p.view.k;                       // keep strokes and handles a constant screen size
  const pts = p.pts.map(q => q.join(',')).join(' ');
  let h = '';
  if (p.pts.length) {
    h += p.closed
      ? `<polygon points="${pts}" fill="rgba(76,175,80,.18)" stroke="#4caf50" stroke-width="${2*s}"/>`
      : `<polyline points="${pts}" fill="none" stroke="#6cf" stroke-width="${2*s}"/>`;
    if (!p.closed && p.pts.length > 1) {
      const [a, b] = [p.pts[p.pts.length - 1], p.pts[0]];
      h += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#6cf"
            stroke-width="${1.5*s}" stroke-dasharray="${5*s},${4*s}" opacity=".6"/>`;
    }
    h += p.pts.map(([x, y]) =>
      `<circle cx="${x}" cy="${y}" r="${3.5*s}" fill="#fff" stroke="#111" stroke-width="${s}"/>`
    ).join('');
  }
  p.svg.setAttribute('width', meta.width);
  p.svg.setAttribute('height', meta.height);
  p.svg.innerHTML = h;
}

document.querySelectorAll('button[data-a]').forEach(b => {
  b.onclick = () => {
    const p = panels[+b.dataset.p];
    const a = b.dataset.a;
    if (a === 'close') { if (p.pts.length >= 3) p.closed = true; }
    else if (a === 'undo') { p.closed = false; p.pts.pop(); }
    else if (a === 'clear') { p.pts = []; p.closed = false; }
    else if (a === 'fit') { fit(p); }
    draw(p);
    $('count').textContent = '—';
  };
});

// Only a closed shape is a boundary; an unfinished polyline contributes nothing.
const roiOf = p => (p.closed && p.pts.length >= 3) ? p.pts : null;
const body = () => ({roi_first: roiOf(panels[0]), roi_last: roiOf(panels[1])});

async function post(path, payload) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'},
                               body: JSON.stringify(payload)});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

$('preview').onclick = async () => {
  const b = body();
  if (!b.roi_first && !b.roi_last) {
    $('count').innerHTML = '<span class="warn">draw and close at least one boundary</span>';
    return;
  }
  $('count').textContent = 'computing…';
  try {
    const d = await post('/roi/preview', b);
    $('count').innerHTML = `<b>${d.n_total}</b> cells selected ` +
      `<span style="color:#888">(first ${d.n_first} · last ${d.n_last} · ` +
      `${d.only_last} reached only via the last frame)</span>`;
  } catch (e) { $('count').innerHTML = `<span class="warn">${e.message}</span>`; }
};

$('save').onclick = async () => {
  const b = body();
  if (!b.roi_first && !b.roi_last) {
    $('count').innerHTML = '<span class="warn">nothing to save</span>';
    return;
  }
  try {
    const d = await post('/roi/save', {...b, path: $('out').value});
    $('count').innerHTML = `saved <b>${d.n_total}</b> cells → <span style="color:#888">${d.path}</span>`;
  } catch (e) { $('count').innerHTML = `<span class="warn">${e.message}</span>`; }
};

addEventListener('resize', () => panels.forEach(fit));

(async () => {
  meta = await (await fetch('/roi/meta')).json();
  $('tf').textContent = 't' + meta.t_first;
  $('tl').textContent = 't' + meta.t_last;
  $('out').value = meta.default_out;
  panels = [mkPanel(0, meta.t_first), mkPanel(1, meta.t_last)];
})();
</script>
</body>
</html>
